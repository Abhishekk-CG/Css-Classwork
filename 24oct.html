<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            display: grid;
            grid-template: 
            "header body body" 1fr
            "header contnt footer" 2fr
            "header contnt futer"; 
            border: 1px solid black;
            height: 90vh;
        }
        div{
            border: 1px solid black;
        }
        .first{
            grid-area: header;
        }
        .second{
            grid-area: body;
        }
        .third{
            grid-area: contnt;
        }
        .forth{
            grid-area: footer;
        }
        .fifth{
            grid-area: futer;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="first"></div>
        <div class="second"></div>
        <div class="third"></div>
        <div class="forth"></div>
        <div class="fifth"></div>
    </div>
</body>
</html>
