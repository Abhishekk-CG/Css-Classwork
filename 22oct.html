<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 5vw;
            padding-left: 5vw;
            height: 5vh;
        }
        .cart{
            display: flex;
            align-items: center;
        }
        .banner{
            background-image: url(kw-background.png);
            background-size: cover;
            height: 35vh;
            width: 100vw;
            font-weight: small;
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: white;
            font-size: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: left;
            gap: 10px;
        }
        .banner p{
            margin-left: 7vw;
        }
        .hash{
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="nav">
            <img src="kw-logo.png" alt="" width="125px">
            <div class="cart">
                <img src="cart-icon.png" alt="" height="25px">
                <span>Cart items(0)</span>
            </div>    
        </div>
        <div class="banner">
            <p>Shop.</p>
            <p>Have Fun.</p>
            <p>Repeat.</p>
            <p class="hash">#NEWANDNOW</p>
        </div>
        <div class="body">
            <div class="discover">
                <div class="book">
                    <img src="" alt="">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
