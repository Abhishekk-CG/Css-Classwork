        *{
            margin:0;
            padding:0
        }
        .main{
            width: 250px;
            height: 100dvh;
            background-color: rgb(243, 245, 245);
            border-radius: 5px;
        }
        .top1{
            background-color: rgb(152, 200, 243);
            display: flex;
            align-items: center;
            border-radius: 10px;
            gap: 10px;
            margin: 10px;
            height: 60px;
        }
        .avtar{
            height: 50px;
            width: 50px;
            border-radius: 50%;
            font-weight: bold;
            background-color: rgb(55, 133, 202);
            font-size: 25px;
            gap: 20px;
            border: none;
            margin: 5px;
        }
        .right{
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 5px;
            margin-left: 50px;
        }

        .body li{
            display: flex;
            align-items: center;
            gap: 20px;
            padding:20px 15px;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        a{
            text-decoration: none;
            color: black;
        }
        .notif{
            width: 20px;
            height: 20px;
            border-radius: 5px;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 40px;
            padding-bottom: 3px;
        }
        .down{
            margin-top: 50px;
        }
        ul li:hover{
            background-color: rgb(197, 249, 197);
        }
        .info{
            display: flex;
            position: fixed;
            bottom: 0;
            left: 0;
            border-width: 100dvh;
        }
        .modiji{
            margin-top: 8px;
            padding-left: 10px;
        } 
        img{
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

    </style>
</head>
