<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Background Styles start */

html {
  height: 100%;
  box-sizing: border-box;
}

body {
  padding: 30px;
}

*,
*:before,
*:after {
  box-sizing: inherit;
}

.wrapper {
  background-color: gold;
  border: 3px dashed black;
  padding: 20px;
}

div {
  border: 3px solid #333;
  background-color: #dfdfdf;
  font-size: 20px;
}



.wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 20px;
    width: 90%;
}

.a1, .a2, .a3, .a4 {
    width: 90%;
}

.b1, .b2 {
    width: 90%; 
}

.c1 {
  width: 90%;
}


@media (min-width: 400px) {
    .wrapper{
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: nowrap;
    }
}

@media (min-width: 600px) {
    .wrapper{
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-evenly;
        gap: auto;
    }
    .a1, .a2, .a3, .a4 {
    width: 20%;
    }
    .b1, .b2 {
    width: 45%; 
    }

.c1 {
  width: 95%;
    }
}


    </style>
</head>
<body>
    <div class="wrapper">

  <div class="a1">A1</div>
  <div class="a2">A2</div>
  <div class="a3">A3</div>
  <div class="a4">A4</div>

  <div class="b1">B1</div>
  <div class="b2">B2</div>

  <div class="c1">C1</div>
  
</div>
</body>
</html>
