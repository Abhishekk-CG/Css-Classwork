<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            clip-path: ellipse(50% 35% at 50% 50%);
            width: 200px;
            height: 200px;
        }
        .cont{
            width: 200px;
            height: 200px;
            background-color: red;
            clip-path: polygon(50% 0%,0% 100%,100% 100%);
        }
    </style>
</head>
<body>
    <img src="book1.png" alt="">
    <div class="cont"></div>
</body>
</html>
